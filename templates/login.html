{% extends "base.html" %}
{% block title %}Sign in · DropOff{% endblock %}
{% block body %}
<section class="narrow">
  <h1>Sign in</h1>
  <p class="lede">Use the username from the README.</p>
  {% if error %}<p class="flash">Those credentials do not match a DropOff account.</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label><span>Username</span><input name="username" required></label>
    <label><span>Password</span><input name="password" type="password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
